{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Fonts: Inter for text, Newsreader for headings -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">

<style>
  /* Text, menu and sidebar: Inter */
  body,
  .masthead,
  .site-title,
  .greedy-nav,
  .greedy-nav a,
  .masthead__menu-item,
  .author__urls,
  .author__urls li,
  .author__urls a,
  .author__pronouns,
  .page__content {
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif !important;
  }

  /* Headings and your name: Newsreader */
  h1, h2, h3,
  .page__title,
  .author__name {
    font-family: "Newsreader", Georgia, serif !important;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* Slightly larger name in the sidebar */
  .author__name { font-size: 1.25em !important; }
</style>

<!-- end custom head snippets -->
