{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#e6ded1"/>

<!-- Font: Inter everywhere -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* Text, menu, sidebar, headings: Inter */
  body,
  .masthead,
  .site-title,
  .greedy-nav,
  .greedy-nav a,
  .masthead__menu-item,
  .author__urls,
  .author__urls li,
  .author__urls a,
  .author__pronouns,
  .page__content,
  h1, h2, h3,
  .page__title,
  .author__name {
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif !important;
  }

  /* Headings and your name: bold, slightly tightened */
  h1, h2, h3,
  .page__title,
  .author__name {
    font-weight: 700;
    letter-spacing: -0.015em;
  }

  /* Slightly larger name in the sidebar */
  .author__name { font-size: 1.35em !important; }

  /* Colours (light mode only, dark mode untouched) */
  html:not([data-theme="dark"]) body,
  html:not([data-theme="dark"]) .masthead,
  html:not([data-theme="dark"]) .greedy-nav,
  html:not([data-theme="dark"]) .page__footer {
    background-color: #e6ded1 !important;
  }
  html:not([data-theme="dark"]) .page__content a,
  html:not([data-theme="dark"]) .page__content a:visited {
    color: #8f3a38 !important;
  }
  html:not([data-theme="dark"]) .author__urls a:hover {
    color: #8f3a38 !important;
  }
</style>

<!-- end custom head snippets -->
